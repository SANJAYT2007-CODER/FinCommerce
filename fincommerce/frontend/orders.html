<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders & Tracking - FinCommerce</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-component"></div>

    <main class="main-content">
      <div class="header-bar">
        <div class="page-title">
          <h2>My Orders & Live Tracking</h2>
          <p>Track your orders, view shipping progress, and request instant refunds</p>
        </div>
      </div>

      <div id="orders-list-container">
        <p style="color: var(--text-muted);">Loading your orders...</p>
      </div>

    </main>
  </div>

  <!-- Return Request Modal -->
  <div class="modal-overlay" id="modal-return">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Request Return & Instant Refund</h3>
        <button class="modal-close">&times;</button>
      </div>
      <form id="return-form">
        <input type="hidden" id="return-order-id">
        <div class="form-group">
          <label class="form-label">Reason for Return</label>
          <select id="return-reason" class="form-control">
            <option value="Defective or Damaged Product">Defective or Damaged Product</option>
            <option value="Wrong Item Delivered">Wrong Item Delivered</option>

            <option value="Item Not as Described">Item Not as Described</option>
            <option value="Better Price Found Elsewhere">Better Price Found Elsewhere</option>
          </select>
        </div>
        <p style="font-size: 0.85rem; color: var(--secondary); margin-bottom: 1rem;">
          <i class="fa-solid fa-circle-check"></i> Approved refunds will be credited instantly to your FinCommerce wallet balance.
        </p>
        <button type="submit" class="btn btn-danger" style="width: 100%;"><i class="fa-solid fa-rotate-left"></i> Submit Return Request</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();
    renderSidebar('orders');

    async function loadOrders() {
      try {
        const res = await ApiClient.get('/api/orders');
        const container = document.getElementById('orders-list-container');

        if (res.success && res.data && res.data.length > 0) {
          container.innerHTML = res.data.map(order => renderOrderCard(order)).join('');
        } else {
          container.innerHTML = `
            <div class="glass-card" style="text-align: center; padding: 4rem;">
              <i class="fa-solid fa-box-open" style="font-size: 3.5rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
              <h3>No orders placed yet</h3>
              <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Explore our store and place your first order!</p>
              <a href="shop.html" class="btn btn-primary"><i class="fa-solid fa-store"></i> Start Shopping</a>
            </div>
          `;
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderOrderCard(order) {
      const steps = ['PLACED', 'CONFIRMED', 'PACKED', 'SHIPPED', 'OUT_FOR_DELIVERY', 'DELIVERED'];
      const currentIdx = steps.indexOf(order.orderStatus.toUpperCase());

      return `
        <div class="glass-card" style="padding: 1.5rem; margin-bottom: 2rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
            <div>
              <div style="font-weight: 800; font-size: 1.1rem; color: var(--primary);">Order #${order.orderNumber}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">Placed on ${new Date(order.createdAt).toLocaleString()} | Tracking: ${order.trackingNumber || 'N/A'}</div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 1.4rem; font-weight: 800; color: var(--secondary);">${formatCurrency(order.finalTotal)}</div>
              <span class="badge ${order.paymentStatus === 'PAID' ? 'badge-success' : 'badge-warning'}">${order.paymentStatus} via ${order.paymentMethod}</span>
            </div>
          </div>

          <!-- Visual Tracking Timeline -->
          ${order.orderStatus !== 'CANCELLED' && order.orderStatus !== 'RETURNED' ? `
            <div class="timeline">
              <div class="timeline-step ${currentIdx >= 0 ? 'completed' : ''}">
                <div class="timeline-icon"><i class="fa-solid fa-receipt"></i></div>
                <div style="font-size: 0.75rem;">Placed</div>
              </div>
              <div class="timeline-step ${currentIdx >= 1 ? 'completed' : ''}">
                <div class="timeline-icon"><i class="fa-solid fa-check-double"></i></div>
                <div style="font-size: 0.75rem;">Confirmed</div>
              </div>
              <div class="timeline-step ${currentIdx >= 2 ? 'completed' : ''}">
                <div class="timeline-icon"><i class="fa-solid fa-box"></i></div>
                <div style="font-size: 0.75rem;">Packed</div>
              </div>
              <div class="timeline-step ${currentIdx >= 3 ? 'completed' : ''}">
                <div class="timeline-icon"><i class="fa-solid fa-truck"></i></div>
                <div style="font-size: 0.75rem;">Shipped</div>
              </div>
              <div class="timeline-step ${currentIdx >= 4 ? 'completed' : ''}">
                <div class="timeline-icon"><i class="fa-solid fa-route"></i></div>
                <div style="font-size: 0.75rem;">Out for Delivery</div>
              </div>
              <div class="timeline-step ${currentIdx >= 5 ? 'completed' : ''}">
                <div class="timeline-icon"><i class="fa-solid fa-house-chimney-user"></i></div>
                <div style="font-size: 0.75rem;">Delivered</div>
              </div>
            </div>
          ` : `
            <div style="padding: 1rem 0;"><span class="badge badge-danger">STATUS: ${order.orderStatus}</span></div>
          `}

          <!-- Order Items Breakdown -->
          <div style="margin-top: 1rem;">
            ${(order.items || []).map(item => `
              <div style="display: flex; gap: 1rem; align-items: center; padding: 0.5rem 0;">
                <img src="${item.productImage}" style="width: 50px; height: 50px; object-fit: cover; border-radius: var(--radius-sm);" alt="${item.productName}">
                <div style="flex: 1;">
                  <div style="font-weight: 600; font-size: 0.9rem;">${item.productName}</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Qty: ${item.quantity} x ${formatCurrency(item.price)}</div>
                </div>
                <div style="font-weight: 700;">${formatCurrency(item.subtotal)}</div>
              </div>
            `).join('')}
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--border-color);">
            ${order.orderStatus === 'DELIVERED' || order.orderStatus === 'CONFIRMED' ? `
              <button class="btn btn-outline btn-sm" onclick="openReturnModal(${order.id})" style="color: var(--danger); border-color: var(--danger);"><i class="fa-solid fa-rotate-left"></i> Return & Refund</button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function openReturnModal(orderId) {
      document.getElementById('return-order-id').value = orderId;
      openModal('modal-return');
    }

    document.getElementById('return-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const orderId = parseInt(document.getElementById('return-order-id').value);
      const reason = document.getElementById('return-reason').value;

      try {
        await ApiClient.post('/api/returns', { orderId, reason });
        showToast('Return approved! Refund credited to your wallet balance.', 'success');
        closeModal('modal-return');
        loadOrders();
      } catch (err) { showToast(err.message, 'error'); }
    });

    loadOrders();
  </script>
</body>
</html>
