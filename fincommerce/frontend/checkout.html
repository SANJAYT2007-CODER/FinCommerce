<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - FinCommerce</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-component"></div>

    <main class="main-content">
      <div class="header-bar">
        <div class="page-title">
          <h2>Checkout & Payment</h2>
          <p>Complete your order securely using Wallet, UPI, or Cards</p>
        </div>
      </div>

      <div class="glass-card" style="padding: 2rem; max-width: 800px; margin: 0 auto;">
        
        <!-- Step Progress Bar -->
        <div class="timeline" style="margin-bottom: 2.5rem;">
          <div class="timeline-step completed">
            <div class="timeline-icon"><i class="fa-solid fa-location-dot"></i></div>
            <div style="font-size: 0.85rem; font-weight: 600;">1. Address</div>
          </div>
          <div class="timeline-step active">
            <div class="timeline-icon"><i class="fa-solid fa-credit-card"></i></div>
            <div style="font-size: 0.85rem; font-weight: 600;">2. Payment</div>
          </div>
          <div class="timeline-step">
            <div class="timeline-icon"><i class="fa-solid fa-circle-check"></i></div>
            <div style="font-size: 0.85rem; font-weight: 600;">3. Confirmation</div>
          </div>
        </div>

        <form id="checkout-form">
          <!-- Address Selection -->
          <div style="margin-bottom: 2rem;">
            <h3>1. Select Delivery Address</h3>
            <div id="addresses-selection-list" style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem;">
              <p style="color: var(--text-muted);">Loading saved addresses...</p>
            </div>
          </div>

          <!-- Payment Method Selection -->
          <div style="margin-bottom: 2rem;">
            <h3>2. Select Payment Method</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 1rem;">
              <label class="glass-card" style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="WALLET" checked>
                <div>
                  <div style="font-weight: 700;">FinCommerce Wallet</div>
                  <div style="font-size: 0.75rem; color: var(--secondary);" id="checkout-wallet-balance">Balance: ₹0.00</div>
                </div>
              </label>

              <label class="glass-card" style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="UPI">
                <div>
                  <div style="font-weight: 700;">UPI / QR</div>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">GPay, PhonePe, Paytm</div>
                </div>
              </label>

              <label class="glass-card" style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="CARD">
                <div>
                  <div style="font-weight: 700;">Credit / Debit Card</div>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">Visa, Mastercard</div>
                </div>
              </label>

              <label class="glass-card" style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.75rem;">
                <input type="radio" name="paymentMethod" value="CASH_ON_DELIVERY">
                <div>
                  <div style="font-weight: 700;">Cash on Delivery</div>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">Pay upon delivery</div>
                </div>
              </label>
            </div>
          </div>

          <!-- Wallet PIN Input -->
          <div class="form-group" id="pin-group">
            <label class="form-label">Transaction Security PIN</label>
            <input type="password" id="checkout-pin" class="form-control" placeholder="1234" maxlength="6" value="1234">
          </div>

          <!-- Total Display & Action -->
          <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
            <div>
              <div style="font-size: 0.85rem; color: var(--text-muted);">Total Payable</div>
              <div style="font-size: 2rem; font-weight: 800; color: var(--primary);" id="checkout-total-price">₹0.00</div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg"><i class="fa-solid fa-lock"></i> Place Order Now</button>
          </div>
        </form>

      </div>

    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();
    renderSidebar('cart');

    const urlParams = new URLSearchParams(window.location.search);
    const couponCode = urlParams.get('coupon') || '';

    async function initCheckout() {
      try {
        // Load Wallet
        const wRes = await ApiClient.get('/api/wallet');
        if (wRes.success && wRes.data) {
          document.getElementById('checkout-wallet-balance').textContent = `Balance: ${formatCurrency(wRes.data.balance)}`;
        }

        // Load Cart Summary
        const cartRes = await ApiClient.get(`/api/cart${couponCode ? '?couponCode=' + couponCode : ''}`);
        if (cartRes.success && cartRes.data) {
          document.getElementById('checkout-total-price').textContent = formatCurrency(cartRes.data.finalTotal);
        }

        // Load Addresses
        const addrRes = await ApiClient.get('/api/users/addresses');
        const addrContainer = document.getElementById('addresses-selection-list');
        if (addrRes.success && addrRes.data && addrRes.data.length > 0) {
          addrContainer.innerHTML = addrRes.data.map((a, idx) => `
            <label class="glass-card" style="padding: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.75rem;">
              <input type="radio" name="addressId" value="${a.id}" ${idx === 0 ? 'checked' : ''}>
              <div>
                <div style="font-weight: 700;">${a.fullName} (${a.mobileNumber})</div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">${a.houseFlat}, ${a.street}, ${a.city}, ${a.state} - ${a.pincode}</div>
              </div>
            </label>
          `).join('');
        } else {
          addrContainer.innerHTML = `<p style="color: var(--text-muted);">No addresses found. <a href="profile.html">Add Address in Profile</a></p>`;
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const addressIdRadio = document.querySelector('input[name="addressId"]:checked');
      if (!addressIdRadio) {
        showToast('Please select a delivery address', 'error');
        return;
      }

      const addressId = parseInt(addressIdRadio.value);
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const pin = document.getElementById('checkout-pin').value;

      try {
        const res = await ApiClient.post('/api/checkout', {
          addressId,
          paymentMethod,
          couponCode,
          pin
        });

        if (res.success && res.data) {
          showToast('Order placed successfully!', 'success');
          setTimeout(() => {
            window.location.href = `orders.html?order=${res.data.orderNumber}`;
          }, 1200);
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    initCheckout();
  </script>
</body>
</html>
