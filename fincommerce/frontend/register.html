<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - FinCommerce</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0; background: radial-gradient(circle at top left, rgba(16, 185, 129, 0.15), transparent);">

  <div class="glass-card" style="width: 100%; max-width: 480px; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <i class="fa-solid fa-user-plus" style="font-size: 2.8rem; color: var(--secondary); margin-bottom: 0.5rem;"></i>
      <h2>Create Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Join FinCommerce and unlock your digital wallet</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="reg-fullname">Full Name</label>
        <input type="text" id="reg-fullname" class="form-control" placeholder="Alex Morgan" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address</label>
        <input type="email" id="reg-email" class="form-control" placeholder="alex@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-mobile">Mobile Number</label>
        <input type="tel" id="reg-mobile" class="form-control" placeholder="9876543212" pattern="[0-9]{10,12}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password</label>
        <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required minlength="6">
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-confirm">Confirm Password</label>
        <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
        <i class="fa-solid fa-check"></i> Register Account
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('reg-fullname').value;
      const email = document.getElementById('reg-email').value;
      const mobileNumber = document.getElementById('reg-mobile').value;
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm').value;

      if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }

      try {
        await Auth.register(fullName, email, mobileNumber, password, confirmPassword);
        showToast('Registration successful! Opening dashboard...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
      }
    });
  </script>
</body>
</html>
