<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - FinCommerce</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-component"></div>

    <main class="main-content">
      <div class="header-bar">
        <div class="page-title">
          <h2>Shopping Cart</h2>
          <p>Review items, apply discount coupons, and proceed to checkout</p>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 2rem;">
        
        <!-- Cart Items List -->
        <div class="glass-card" style="padding: 1.5rem;">
          <h3>Cart Items</h3>
          <div id="cart-items-list" style="margin-top: 1rem;">
            <p style="color: var(--text-muted);">Loading cart items...</p>
          </div>
        </div>

        <!-- Order & Price Summary -->
        <div>
          <!-- Coupon Card -->
          <div class="glass-card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
            <h4><i class="fa-solid fa-ticket" style="color: var(--primary);"></i> Apply Coupon</h4>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem;">
              <input type="text" id="coupon-code-input" class="form-control" placeholder="Enter coupon (e.g. WELCOME10)">
              <button class="btn btn-outline" onclick="applyCoupon()"><i class="fa-solid fa-check"></i> Apply</button>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">Available: <strong style="color: var(--secondary);">WELCOME10</strong> (10% OFF), <strong style="color: var(--secondary);">SAVE500</strong> (₹500 OFF)</div>
          </div>

          <!-- Price Summary -->
          <div class="glass-card" style="padding: 1.5rem;">
            <h3>Order Summary</h3>
            <div style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
              <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                <span>Subtotal</span>
                <span id="summary-subtotal" style="color: var(--text-main); font-weight: 600;">₹0.00</span>
              </div>
              <div style="display: flex; justify-content: space-between; color: var(--secondary);">
                <span>Coupon Discount</span>
                <span id="summary-discount" style="font-weight: 600;">-₹0.00</span>
              </div>
              <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                <span>Delivery Fee</span>
                <span id="summary-delivery" style="color: var(--text-main); font-weight: 600;">₹0.00</span>
              </div>
              <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                <span>Estimated Tax (5%)</span>
                <span id="summary-tax" style="color: var(--text-main); font-weight: 600;">₹0.00</span>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; margin-bottom: 1.5rem;">
              <span style="font-size: 1.2rem; font-weight: 700;">Final Amount</span>
              <span id="summary-total" style="font-size: 1.8rem; font-weight: 800; color: var(--primary); font-family: var(--font-heading);">₹0.00</span>
            </div>

            <button class="btn btn-primary btn-lg" style="width: 100%;" onclick="proceedToCheckout()"><i class="fa-solid fa-lock"></i> Proceed to Checkout</button>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();
    renderSidebar('cart');

    let currentCoupon = '';

    async function loadCart() {
      try {
        const res = await ApiClient.get(`/api/cart${currentCoupon ? '?couponCode=' + currentCoupon : ''}`);
        if (res.success && res.data) {
          const cart = res.data;
          renderCartItems(cart.items || []);

          document.getElementById('summary-subtotal').textContent = formatCurrency(cart.subtotal);
          document.getElementById('summary-discount').textContent = `-${formatCurrency(cart.discountAmount)}`;
          document.getElementById('summary-delivery').textContent = cart.deliveryFee > 0 ? formatCurrency(cart.deliveryFee) : 'FREE';
          document.getElementById('summary-tax').textContent = formatCurrency(cart.taxAmount);
          document.getElementById('summary-total').textContent = formatCurrency(cart.finalTotal);
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderCartItems(items) {
      const container = document.getElementById('cart-items-list');
      if (items.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem;">
            <i class="fa-solid fa-cart-arrow-down" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
            <p style="color: var(--text-muted);">Your shopping cart is currently empty.</p>
            <a href="shop.html" class="btn btn-primary btn-sm" style="margin-top: 1rem;"><i class="fa-solid fa-store"></i> Start Shopping</a>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(item => `
        <div style="display: flex; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--border-color);">
          <img src="${item.productImage}" style="width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius-sm);" alt="${item.productName}">
          <div style="flex: 1;">
            <div style="font-weight: 700; font-size: 1rem;">${item.productName}</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">${item.productBrand}</div>
            <div style="color: var(--secondary); font-weight: 700; margin-top: 0.25rem;">${formatCurrency(item.unitPrice)}</div>
          </div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <button class="btn btn-outline btn-sm" onclick="updateQty(${item.id}, ${item.quantity - 1})" style="padding: 0.2rem 0.5rem;">-</button>
            <span style="font-weight: 700;">${item.quantity}</span>
            <button class="btn btn-outline btn-sm" onclick="updateQty(${item.id}, ${item.quantity + 1})" style="padding: 0.2rem 0.5rem;">+</button>
          </div>
          <div style="font-weight: 800; min-width: 90px; text-align: right;">${formatCurrency(item.subtotal)}</div>
          <button onclick="removeItem(${item.id})" class="btn btn-outline btn-sm" style="color: var(--danger); border-color: var(--danger);"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('');
    }

    async function updateQty(itemId, newQty) {
      try {
        await ApiClient.put(`/api/cart/items/${itemId}`, { quantity: newQty });
        loadCart();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function removeItem(itemId) {
      try {
        await ApiClient.delete(`/api/cart/items/${itemId}`);
        showToast('Item removed from cart', 'info');
        loadCart();
      } catch (err) { showToast(err.message, 'error'); }
    }

    function applyCoupon() {
      const code = document.getElementById('coupon-code-input').value.trim();
      if (!code) return;
      currentCoupon = code;
      showToast(`Applying coupon '${code}'...`, 'info');
      loadCart();
    }

    function proceedToCheckout() {
      window.location.href = `checkout.html${currentCoupon ? '?coupon=' + currentCoupon : ''}`;
    }

    loadCart();
  </script>
</body>
</html>
